name: Object Detector
signature: iodevice/object_detector
isa: Image Analyzer
description: |
    An object detector captures images from a camera and uses a `Core ML
    <https://developer.apple.com/documentation/coreml>`_ model to locate and
    classify objects in them.  For information on obtaining or creating a
    suitable model, see `Getting a Core ML Model
    <https://developer.apple.com/documentation/coreml/getting-a-core-ml-model>`_.

    On macOS, an object detector can use any camera (internal or external) that
    is supported by the operating system.  On iOS, it always uses the
    built-in, front-facing, wide-angle camera.
parameters: 
  - 
    name: model_path
    required: yes
    description: |
        Filesystem path to a Core ML object detection model (i.e. a
        ``.mlmodel`` file).

        *Note*: The experiment must also declare the model file as a `File
        Resource`, e.g.::

            resource ('my_model.mlmodel')

            iodevice/object_detector my_detector (
                model_path = 'my_model.mlmodel'
                ...
                )
  - 
    name: results
    required: yes
    description: |
        Variable in which to store the most recent detection results (as a
        list), subject to `minimum_confidence`_.  Each element in the list is
        itself a list with the following three elements:

        1. The classification label assigned to the object (as a string).

        2. The bounding box of the object, specified as a four-element list
           of the form ``[x_min, y_min, x_max, y_max]``, where *(x_min, y_min)*
           and *(x_max, y_max)* are the coordinates of the lower-left and
           upper-right corners, respectively, of the bounding box.  Each
           coordinate is normalized to the dimensions of the image and lies
           between 0.0 and 1.0 (inclusive).

        3. The confidence for the detection result.  Typically, the value will
           be between 0.0 and 1.0 (inclusive), where 1 is most confident.

           *Note*: The exact meaning of the confidence value depends on the
           model.  If the model does not support confidence estimation, the
           value will always be 1.

        If detection fails to produce any valid results, the variable is set to
        an empty list.


